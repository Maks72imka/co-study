<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат — Co-Study</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f1f5f9; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #e2e8f0; z-index: 10; }
        .back-btn { text-decoration: none; color: #64748b; font-size: 1.2rem; font-weight: bold; }
        
        /* Контейнер чата с относительным позиционированием для плавающей даты */
        .chat-wrapper { position: relative; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* ПЛАВАЮЩИЙ БЛОК ДАТЫ (по центру сверху) */
        .floating-date-badge {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(15, 23, 42, 0.6);
            color: white;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            backdrop-filter: blur(4px);
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: opacity 0.2s ease;
            opacity: 0; /* Изначально скрыто, пока не пойдет скролл */
        }

        .messages-container { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        /* Сообщения */
        .msg { max-width: 75%; padding: 8px 12px 20px 12px; border-radius: 12px; font-size: 0.95rem; word-wrap: break-word; position: relative; line-height: 1.4; }
        .msg.incoming { background-color: white; align-self: flex-start; border: 1px solid #e2e8f0; color: #1e293b; }
        .msg.outgoing { background-color: #4f46e5; align-self: flex-end; color: white; }
        
        /* Под сообщением теперь ТОЛЬКО время */
        .msg-time { font-size: 0.7rem; position: absolute; bottom: 4px; right: 10px; }
        .msg.incoming .msg-time { color: #94a3b8; }
        .msg.outgoing .msg-time { color: rgba(255, 255, 255, 0.7); }

        .input-area { background: white; padding: 15px; display: flex; gap: 12px; border-top: 1px solid #e2e8f0; z-index: 10; }
        .input-area input { flex-grow: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 24px; outline: none; font-size: 1rem; }
        .input-area button { background-color: #4f46e5; color: white; border: none; padding: 12px 24px; border-radius: 24px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <a href="feed.html" class="back-btn">← Назад</a>
        <div><b id="chatTitle">Диалог</b></div>

        <!-- Плавающая плашка даты -->

        <div class="messages-container" id="messagesContainer"></div>
    </div>

    <form class="input-area" id="chatForm">
        <input type="text" id="messageInput" placeholder="Напишите сообщение..." required autocomplete="off">
        <button type="submit">Отправить</button>
    </form>

        async function initChat() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) { window.location.href = 'auth.html'; return; }
            myId = user.id;

            if (user.user_metadata && user.user_metadata.display_name) {
                myName = user.user_metadata.display_name;
            }

            const { data: myProfile } = await _supabase.from('students').select('name').eq('user_id', myId).maybeSingle();
            if (myProfile) { myName = myProfile.name; }

            document.getElementById('chatTitle').textContent = `Чат с: ${partnerName}`;
            
            await markAsRead();
            await loadMessages(true); // true означает прокрутку вниз при первом открытии

            }, 3000);

        // Функция проверки: сегодня, вчера или точная дата (с учетом года)
        function getSmartDateString(isoString) {
            if (!isoString) return "";
            const msgDate = new Date(isoString);
            const today = new Date();
            
            const isToday = msgDate.toDateString() === today.toDateString();
            
            const yesterday = new Date();
            yesterday.setDate(today.getDate() - 1);
            const isYesterday = msgDate.toDateString() === yesterday.toDateString();

            if (isToday) return "Сегодня";
            if (isYesterday) return "Вчера";

            // Месяцы прописью для красивого вывода
            const months = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
            const day = msgDate.getDate();
            const monthName = months[msgDate.getMonth()];
            const year = msgDate.getFullYear();
            const currentYear = today.getFullYear();

            // Если год не текущий, добавляем двухзначный год (например, "24 октября 25 г.")
            if (year !== currentYear) {
                const shortYear = String(year).slice(-2);
                return `${day} ${monthName} ${shortYear} г.`;
            }

            return `${day} ${monthName}`;
        }

        // Функция для получения только времени (например, "17:03")
        function getMessageTime(isoString) {
            if (!isoString) return "";
            const date = new Date(isoString);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        async function markAsRead() {
            if (!myId || !partnerId) return;
            await _supabase
                .from('messages')
                .update({ is_read: true })
                .eq('sender', partnerId)
                .eq('partner', myId)
                .eq('is_read', false);
        }

        async function loadMessages(scrollToBottomFlag = false) {
            const { data } = await _supabase.from('messages').select('*');
            if (!data) return;

            cachedMessages = data.filter(m => 
                (m.sender === myId && m.partner === partnerId) || 
                (m.sender === partnerId && m.partner === myId)
            );

            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            
            cachedMessages.forEach((msg, index) => {
                const msgDiv = document.createElement('div');
                msgDiv.className = msg.sender === myId ? 'msg outgoing' : 'msg incoming';
                
                // Сохраняем дату в атрибут для определения при скролле
                msgDiv.setAttribute('data-date-string', getSmartDateString(msg.created_at));

                const timeStr = getMessageTime(msg.created_at);

                msgDiv.innerHTML = `
                    <div>${msg.text}</div>
                    <div class="msg-time">${timeStr}</div>
                `;
                container.appendChild(msgDiv);
            });

            if (scrollToBottomFlag) {
                container.scrollTop = container.scrollHeight;
            }
            updateFloatingDate();
        }
