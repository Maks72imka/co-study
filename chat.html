<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат — Co-Study</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f1f5f9; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #e2e8f0; z-index: 10; }
        .back-btn { text-decoration: none; color: #64748b; font-size: 1.2rem; font-weight: bold; }
        
        .chat-wrapper { position: relative; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* Плавающая плашка даты */
        .floating-date-badge {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(15, 23, 42, 0.75);
            color: white;
            padding: 5px 14px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            backdrop-filter: blur(4px);
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .messages-container { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        /* Идеальная минимальная ширина под время "22:22" и компактные отступы */
        .msg { 
            max-width: 75%; 
            min-width: 68px; 
            padding: 6px 10px 18px 10px; 
            border-radius: 12px; 
            font-size: 0.95rem; 
            word-wrap: break-word; 
            position: relative; 
            line-height: 1.4; 
        }
        .msg.incoming { background-color: white; align-self: flex-start; border: 1px solid #e2e8f0; color: #1e293b; }
        .msg.outgoing { background-color: #4f46e5; align-self: flex-end; color: white; }
        
        /* Время под сообщением аккуратно в углу */
        .msg-time { font-size: 0.65rem; position: absolute; bottom: 3px; right: 8px; }
        .msg.incoming .msg-time { color: #94a3b8; }
        .msg.outgoing .msg-time { color: rgba(255, 255, 255, 0.75); }

        .input-area { background: white; padding: 15px; display: flex; gap: 12px; border-top: 1px solid #e2e8f0; z-index: 10; }
        .input-area input { flex-grow: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 24px; outline: none; font-size: 1rem; }
        .input-area button { background-color: #4f46e5; color: white; border: none; padding: 12px 24px; border-radius: 24px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <a href="feed.html" class="back-btn">← Назад</a>
        <div><b id="chatTitle">Диалог</b></div>
    </header>

    <div class="chat-wrapper">
        <div class="floating-date-badge" id="floatingDateBadge">Сегодня</div>
        <div class="messages-container" id="messagesContainer"></div>
    </div>

    <form class="input-area" id="chatForm">
        <input type="text" id="messageInput" placeholder="Напишите сообщение..." required autocomplete="off">
        <button type="submit">Отправить</button>
    </form>

    <script>
        const SUPABASE_URL = "https://oeomhjmeaantcfznojwg.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lb21oam1lYWFudGNmem5vandnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDQ3MDYsImV4cCI6MjA5NTk4MDcwNn0.MnOP_d3Qu1CLYzn8l8FW7DMFNH7lP5FILrtiyFzApWA";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const partnerId = urlParams.get('partner');
        const partnerName = urlParams.get('name') || "Собеседник";

        let myId = null;
        let myName = "Вы"; 

        async function initChat() {
            try {
                const { data: { user } } = await _supabase.auth.getUser();
                if (!user) { window.location.href = 'auth.html'; return; }
                myId = user.id;

                if (user.user_metadata && user.user_metadata.display_name) {
                    myName = user.user_metadata.display_name;
                }

                const { data: myProfile } = await _supabase.from('students').select('name').eq('user_id', myId).maybeSingle();
                if (myProfile && myProfile.name) { myName = myProfile.name; }

                document.getElementById('chatTitle').textContent = `Чат с: ${partnerName}`;
                
                await markAsRead();
                await loadMessages(true);
                
                setInterval(async () => {
                    await markAsRead();
                    await loadMessages(false);
                }, 3000);
            } catch (err) {
                console.error("Ошибка инициализации чата:", err);
            }
        }

        function getSmartDateString(isoString) {
            if (!isoString) return "Сегодня";
            try {
                const msgDate = new Date(isoString);
                if (isNaN(msgDate.getTime())) return "Сегодня";

                const today = new Date();
                const isToday = msgDate.toDateString() === today.toDateString();
                
                const yesterday = new Date();
                yesterday.setDate(today.getDate() - 1);
                const isYesterday = msgDate.toDateString() === yesterday.toDateString();

                if (isToday) return "Сегодня";
                if (isYesterday) return "Вчера";

                const months = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
                const day = msgDate.getDate();
                const monthName = months[msgDate.getMonth()];
                const year = msgDate.getFullYear();
                const currentYear = today.getFullYear();

                if (year !== currentYear) {
                    const shortYear = String(year).slice(-2);
                    return `${day} ${monthName} ${shortYear} г.`;
                }

                return `${day} ${monthName}`;
            } catch (e) {
                return "Сегодня";
            }
        }

        function getMessageTime(isoString) {
            if (!isoString) {
                const now = new Date();
                return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            }
            try {
                const date = new Date(isoString);
                if (isNaN(date.getTime())) return "";
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return `${hours}:${minutes}`;
            } catch (e) {
                return "";
            }
        }

        async function markAsRead() {
            if (!myId || !partnerId) return;
            try {
                await _supabase
                    .from('messages')
                    .update({ is_read: true })
                    .eq('sender', partnerId)
                    .eq('partner', myId)
                    .eq('is_read', false);
            } catch (e) {
                console.error("Ошибка обновления статуса прочтения:", e);
            }
        }

        async function loadMessages(scrollToBottomFlag = false) {
            try {
                const { data, error } = await _supabase.from('messages').select('*').order('id', { ascending: true });
                if (error || !data) return;

                const filtered = data.filter(m => 
                    (m.sender === myId && m.partner === partnerId) || 
                    (m.sender === partnerId && m.partner === myId)
                );

                const container = document.getElementById('messagesContainer');
                container.innerHTML = '';
                
                filtered.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = msg.sender === myId ? 'msg outgoing' : 'msg incoming';
                    
                    const dateAttr = getSmartDateString(msg.created_at);
                    msgDiv.setAttribute('data-date-string', dateAttr);

                    const timeStr = getMessageTime(msg.created_at);

                    msgDiv.innerHTML = `
                        <div>${msg.text}</div>
                        <div class="msg-time">${timeStr}</div>
                    `;
                    container.appendChild(msgDiv);
                });

                if (scrollToBottomFlag) {
                    container.scrollTop = container.scrollHeight;
                }
                updateFloatingDate();
            } catch (err) {
                console.error("Ошибка загрузки сообщений:", err);
            }
        }

        const messagesContainer = document.getElementById('messagesContainer');
        const floatingBadge = document.getElementById('floatingDateBadge');
        let scrollTimeout;

        messagesContainer.addEventListener('scroll', () => {
            updateFloatingDate();
            floatingBadge.style.opacity = '1';
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                floatingBadge.style.opacity = '0';
            }, 1500);
        });

        function updateFloatingDate() {
            const msgElements = messagesContainer.querySelectorAll('.msg');
            if (msgElements.length === 0) return;

            const containerRect = messagesContainer.getBoundingClientRect();
            const containerCenter = containerRect.top + containerRect.height / 2;

            let closestMsg = msgElements[0];
            let minDistance = Infinity;

            msgElements.forEach(msg => {
                const rect = msg.getBoundingClientRect();
                const msgCenter = rect.top + rect.height / 2;
                const distance = Math.abs(containerCenter - msgCenter);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestMsg = msg;
                }
            });

            const dateStr = closestMsg.getAttribute('data-date-string');
            if (dateStr) {
                floatingBadge.textContent = dateStr;
            }
        }

        document.getElementById('chatForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text) return;

            input.value = '';
            
            try {
                const { error } = await _supabase.from('messages').insert([{ 
                    sender: myId, 
                    sender_name: myName,
                    partner: partnerId, 
                    partner_name: partnerName,
                    text: text
                }]);
                
                if (error) {
                    alert("Не удалось отправить сообщение: " + error.message);
                } else {
                    await loadMessages(true);
                }
            } catch (err) {
                alert("Ошибка отправки: " + err.message);
            }
        });

        initChat();
    </script>
</body>
</html>
